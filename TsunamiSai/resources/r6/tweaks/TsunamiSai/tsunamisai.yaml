UIIcon.TsunamiSaiIcon:
    $type: UIIcon
    atlasResourcePath: mod\tsunamisai\icons.inkatlas
    atlasPartName: sai_weapon_icon

UIIcon.TsunamiSaiPerkIcon:
    $type: UIIcon
    atlasResourcePath: mod\tsunamisai\icons.inkatlas
    atlasPartName: sai_perk_icon

Items.tsunamisai_weapon_mod_ability:
  $base: Items.IconicWeaponModAbilityBase
  UIData:
    iconPath: ability_offensive
    localizedDescription: LocKey#tsunamisai_weapon_mod_desc

Items.tsunamisai_weapon_mod:
  $base: Items.IconicMeleeWeaponModBase
  OnAttach: [Items.tsunamisai_weapon_mod_ability]
  statModifiers:
  - !append
    $type: ConstantStatModifier
    statType: BaseStats.BleedingApplicationRate
    modifierType: Additive
    value: 50.0

KnifeAttacks.TsunamiSaiKnifeThrowAttackProjectile:
  $base: KnifeAttacks.PunkKnifeThrowAttackProjectile
  projectileTemplateName: tsunamisai_weapon_knife

HUDWeaponIcon.tsunamisai_weapon:
  $type: gamedataUIIcon_Record
  atlasResourcePath: mod\tsunamisai\icons.inkatlas
  atlasPartName: sai_weapon_hub_icon


Items.tsunamisai_weapon:
  $base: Items.Preset_Knife_Default
  appearanceResourceName: tsunamisai_weapon_appfile
  projectileTemplateName: tsunamisai_weapon_knife
  useProjectileAppearance: true
  attacks:
    - !append KnifeAttacks.TsunamiSaiKnifeThrowAttackProjectile
    - !remove t"KnifeAttacks.KnifeComboAttack1"
    - !append KnifeAttacks.TsunamiSaiComboAttack1
    - !append KnifeAttacks.TsunamiSaiDeflectAttack
    - !append KnifeAttacks.TsunamiSaiLeftAttack
  visualTags:
    - TsunamiSai
  slotPartListPreset:
  - !append
    slot: AttachmentSlots.IconicMeleeWeaponMod1
    itemPartPreset: Items.tsunamisai_weapon_mod
  displayName: TsunamiSai-Name
  gameplayDescription: TsunamiSai-Desc
  iconPath: TsunamiSaiIcon
  hudIcon: HUDWeaponIcon.tsunamisai_weapon
  blueprint: Items.Iconic_Melee_Blueprint
  quality: Quality.Random
  tags:
    - !append IconicWeapon
  statModifiers:
    - !append Quality.IconicItem
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.BlockFactor
      modifierType: Additive
      value: 0.5  #Adding .5 to each hand off the base .5 gives a total of 2 - better than a normal knife but still below a katana


  statModifierGroups:
    - !append Items.IconicQualityRandomization
  OnAttach:
    - !append
      $type: GameplayLogicPackage
      animationWrapperOverrides: [w_tsunamisai]
  # Dual Wield
  #objectActions:
  #  - !append PlayerPuppet.TsunamiSaiDual

Items.tsunamisai_weapon_left:
  $base: Items.tsunamisai_weapon
  stateMachineName: ""
  placementSlots:
    - !append AttachmentSlots.TSaiLeftGrip
    - !append AttachmentSlots.TSaiLeftGripDT
    
Items.tsunamisai_weapon.scaleToPlayer: true  
Items.tsunamisai_weapon_left.scaleToPlayer: true

KnifeAttacks.TsunamiSaiComboAttack1:
  $base: KnifeAttacks.KnifeComboAttack1
  trailAttackSide: tsai
  trailStartDelay: 0.1
  trailStopDelay: 0.4

KnifeAttacks.TsunamiSaiDeflectAttack:
  $base: KnifeAttacks.KnifeComboAttack1
  attackName: MeleeDeflectAttack0
  attackSubtype: AttackType.DeflectAttack
  hitReactionSeverityMin: 2
  hitReactionSeverityMax: 2
  attackEffectDelay: 0.16
  startupDuration: 0.0333
  activeDuration: 0.3333
  recoverDuration: 0.45
  trailAttackSide: tsai
  trailStartDelay: 0.16
  trailStopDelay: 0.46

KnifeAttacks.TsunamiSaiLeftAttack:
  $base: KnifeAttacks.TsunamiSaiComboAttack1
  attackName: MeleeComboAttack4
  trailStartDelay: 9.0
  trailStopDelay: 9.5

AttachmentSlots.TSaiLeftGrip:
  $base: AttachmentSlots.WeaponLeft
  entitySlotName: TSaiLeftGrip
  tagsForActiveItemCycling: []

AttachmentSlots.TSaiLeftGripDT:
  $base: AttachmentSlots.WeaponLeft
  entitySlotName: TSaiLeftGripDT
  tagsForActiveItemCycling: [] 

Character.Player_Puppet_Base:
  attachmentSlots:
    - !append AttachmentSlots.TSaiLeftGrip
    - !append AttachmentSlots.TSaiLeftGripDT

#Photo mode
photo_mode.poseItems.poseItemsDefinitions:
  - !append-once "POSE_WEAPON_TSAI_PAIR:AcceptDualWieldItemType=Wea_Knife"

PhotoModePoses.tsai_pair_ready:
  $base: PhotoModePoses.idle__knife
  animationName: tsai_pair_ready
  acceptedWeaponConfig: POSE_WEAPON_TSAI_PAIR
  displayName: <your pose name>

photo_mode.character.femalePoses:
  - !append-once PhotoModePoses.tsai_pair_ready

#take advantage of unused perk slot
NewPerks.Cool_Right_Perk_3_3:
  slot: NewPerks.Inbetween_Right_2
  
  requiresPerks:
    - NewPerks.Cool_Central_Perk_2_3
    - NewPerks.Cool_Right_Perk_2_4
  tier: NewPerks.AdeptNewPerkTier
  perkIcon: UIIcon.TsunamiSaiPerkIcon

NewPerks.CoolAttributeData:
  perks:
    - !append NewPerks.Cool_Right_Perk_3_3    

#Finisher
Prereqs.TsunamiSaiDecapDelay:
  $base: Prereqs.DurationPrereq
  duration: 1.3

Effectors.TsunamiSaiDecapFinisher:
  $base: Effectors.PlayerKatanaFinisher
  prereqRecord: Prereqs.TsunamiSaiDecapDelay

#Flurry
BaseStatusEffect.TsunamiSaiFlurryTequila:
  $base: BaseStatusEffect.ValentinosFrenzyTripleTequilaStackSE
  duration:
    statModifiers:
      - $type: ConstantStatModifier
        statType: BaseStats.MaxDuration
        modifierType: Additive
        value: 3.0
  removeAllStacksWhenDurationEnds: true

BaseStatusEffect.TsunamiSaiFlurryRate:
  $type: gamedataStatusEffect_Record
  $base: BaseStatusEffect.ValentinosFrenzySE
  gameplayTags: []
  duration:
    statModifiers:
      - $type: ConstantStatModifier
        statType: BaseStats.MaxDuration
        modifierType: Additive
        value: 3.0

BaseStatusEffect.TsunamiSaiParryStun:
  $base: BaseStatusEffect.Stun
  duration:
    statModifiers:
      - $type: ConstantStatModifier
        statType: BaseStats.MaxDuration
        modifierType: Additive
        value: 2.0